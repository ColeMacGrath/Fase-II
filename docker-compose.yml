services:
  backend:
    build:
      context: ./backend
    image: agente-os-cloud:1.0.0
    container_name: agente-os-cloud
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    # Capa Nube efímera: solo lectura y sin volúmenes.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
